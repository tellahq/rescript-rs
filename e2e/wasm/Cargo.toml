[package]
name = "wasm-bridge-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rescript-rs = { path = "../../rescript-rs", features = ["wasm-bindgen"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.113"

[profile.release]
lto = true
