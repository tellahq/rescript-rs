[package]
name = "rescript-rs-macros"
version = "0.1.0"
authors = ["Tella"]
edition = "2021"
description = "derive macro for rescript-rs"
license = "MIT"

[features]
serde-compat = ["termcolor"]
no-serde-warnings = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2.0.28", features = ["full", "extra-traits", "visit-mut"] }
termcolor = { version = "1", optional = true }
